name: pages

# Publishes the website (the landing page and the guide in docs/guide) to GitHub Pages.
# It runs whenever main changes. Run it by hand from the Actions tab to refresh the version shown
# on the download button after a release, because a release made by the release workflow does not start it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let a deployment that has started finish, and keep only the newest one waiting behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build reads the newest release tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: pip install -r site/requirements.txt
      - name: Build the site and check its links
        run: make site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
